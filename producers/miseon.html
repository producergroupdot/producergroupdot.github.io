<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 이 페이지만 한 겹 아래에 있습니다. 모든 상대 경로를 저장소 뿌리에서 풀도록 맞춥니다.
     data/*.json 의 img/… 경로가 여기서도 그대로 통하게 하기 위한 것입니다. -->
<base href="../">

<link rel="icon" href="/img/brand/favicon-32.png" sizes="32x32">
<link rel="icon" href="/img/brand/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">

<!-- 링크 미리보기. og:image 는 반드시 전체 주소여야 한다 — 상대 경로면 뜨지 않는다.
     og:title·og:description 의 data-en 은 영문 화면에서 js/i18n.js 가 갈아 끼운다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="프로듀서그룹 도트" data-en="Producer Group DOT">

<meta property="og:image" content="https://producergroupdot.kr/img/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
