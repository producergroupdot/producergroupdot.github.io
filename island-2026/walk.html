 "video", "id": "mw4h4a55eg5o0", "place": "강화시장", "textEn": "The end of Ganghwa Sijang market, the start of the paddy road\nPeople walk. The migratory birds leave their place. The wind blows. The water ripples.", "placeEn": "Ganghwa Sijang market"}, {"day": 1, "kind": "기타", "text": "12시 45분 / 강화터미널 / 앤드씨어터 멤버들은 분주한 강화터미널 대합실에 앉아 관객을 기다렸다. 버스가 머물렀다 떠난다. 사람들은 저마다 바삐 어딘가로 향한다. From Junsub", "takenAt": "2026-11-06T03:49:10.000Z", "createdAt": "2026-11-06T06:39:38.178Z", "place": "강화터미널", "x": 432, "y": 192, "asset": "e1491c9b881f89e7c5c5e273e22c3cab", "mediaType": "image", "id": "mw4ltxoildt90", "group": "gmw4ltwdj5i3", "textEn": "12:45 / Ganghwa Bus Terminal / A.N.D. Theatre members sat in the busy waiting hall of Ganghwa Bus Terminal, waiting for an audience. A bus stopped and then left. People hurried off somewhere, each in their own direction. From Junsub"}, {"day": 1, "kind": "기타", "text": "", "takenAt": "2026-11-06T03:49:09.000Z", "createdAt": "2026-11-06T06:39:39.448Z", "place": "강화터미널", "x": 432, "y": 192, "asset": "6b90345c22746127c22796e71c8266b6", "mediaType": "image", "id": "mw4ltynst68yg", "group": "gmw4ltwdj5i3"}, {"day": 1, "kind": "음악 듣기", "text": "나무가 바람에 흔들리는 소리, 사페의 연주 소리, 따스한 햇빛 @용당돈대 from 미선", "takenAt": "2026-11-06T06:03:00.000Z", "createdAt": "2026-11-06T07:04:39.339Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "a67265a9172050c12425a45e378dabdc", "mediaType": "video", "id": "mw4mq3zfd4ngx", "textEn": "The sound of trees swaying in the wind, the sound of Sape's playing, warm sunlight @Yongdang Dondae battery from Miseon"}, {"day": 1, "kind": "걷기", "text": "강화터미널을 지나 논길을 따라 걷다보니 바다가 근처다. 또 다른 길로 이끄는 문을 여는 듯한 덤불을 지난다. 사람들은 지치는 줄도 모르고 걷고 또 걷는다.", "takenAt": "2026-11-06T05:11:11.000Z", "createdAt": "2026-11-06T07:05:50.784Z", "place": "용진진 근처 둘레길", "x": 522.9, "y": 321.3, "asset": "a8524079a563a096ebd737d1c521e0ad", "mediaType": "image", "lat": 37.707547222222225, "lng": 126.51673055555555, "id": "mw4mrn40i0t41", "group": "gmw4mrl2rdzj", "textEn": "After passing Ganghwa Bus Terminal and following a rice-paddy path, the sea is nearby. You pass a thicket that seems to open a door leading to another path. People walk on and on without even noticing they are tired.", "placeEn": "Loop trail near Yongjinjin ferry crossing"}, {"day": 1, "kind": "걷기", "text": "", "takenAt": "2026-11-06T05:19:38.000Z", "createdAt": "2026-11-06T07:05:52.762Z", "place": "용진진 근처 둘레길", "x": 517.7, "y": 306.4, "asset": "db9dc61a31880c36089f215cfb0288ee", "mediaType": "image", "lat": 37.71199722222222, "lng": 126.51419722222222, "id": "mw4mromyr09qk", "group": "gmw4mrl2rdzj", "placeEn": "Loop trail near Yongjinjin ferry crossing"}, {"day": 1, "kind": "걷기", "text": "", "takenAt": "2026-11-06T05:19:46.000Z", "createdAt": "2026-11-06T07:05:54.403Z", "place": "용진진 근처 둘레길", "x": 517.7, "y": 306.4, "asset": "1fbd3e47b895dbb060087b8fdc5fef41", "mediaType": "image", "lat": 37.711983333333336, "lng": 126.51420555555555, "id": "mw4mrpwje9vpf", "group": "gmw4mrl2rdzj", "placeEn": "Loop trail near Yongjinjin ferry crossing"}, {"day": 1, "kind": "쉬어 가기", "text": "용당돈대, 한 가운데 나무와 바람의의 연주소리, \n오랑오랑 드럼 씨어터의 사페 연주소리\n고도를 기다리며......", "takenAt": "2026-11-06T05:26:55.000Z", "createdAt": "2026-11-06T07:21:21.932Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "1f1ecfdbe418f1b561338669fa6f2c16", "mediaType": "image", "id": "mw4nbll8zyy01", "group": "gmw4nbhzcu4x", "textEn": "Yongdang Dondae fort, in the middle, the sound of trees and wind's performance,\nthe sound of the Oarang Oarang Drum Theatre's sapé performance\nWaiting for Godot......"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T05:51:08.000Z", "createdAt": "2026-11-06T07:21:25.428Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "55f555077d5010f73a4a914f11f9dcba", "mediaType": "image", "id": "mw4nboacixkmq", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T05:51:21.000Z", "createdAt": "2026-11-06T07:21:28.799Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "5be0592012c5716597377b56e579e244", "mediaType": "image", "id": "mw4nbqvzi6u8w", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T05:51:45.000Z", "createdAt": "2026-11-06T07:21:31.250Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "6c97f6ba14809404310d97de71d5dbb9", "mediaType": "image", "id": "mw4nbss2n1qw3", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T05:51:59.000Z", "createdAt": "2026-11-06T07:21:33.919Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "9fdc4b06bea49a7cc005f4417248d2c8", "mediaType": "image", "id": "mw4nbuu8mlnw8", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T05:54:39.000Z", "createdAt": "2026-11-06T07:21:37.599Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "9f4812991b6a96b0cd59622aea244c11", "mediaType": "image", "id": "mw4nbxofalfpv", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T05:59:50.000Z", "createdAt": "2026-11-06T07:21:41.387Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "b0d959a0065d1cbaa36dbfc6b414a10e", "mediaType": "image", "id": "mw4nc0lo4fh6z", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T06:00:46.000Z", "createdAt": "2026-11-06T07:21:44.674Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "5f575c653f06562850a0b352097b3cb2", "mediaType": "image", "id": "mw4nc34z63ax6", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T06:02:12.000Z", "createdAt": "2026-11-06T07:21:47.124Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "933e08f6b563630426cda9d6d7c7ae90", "mediaType": "image", "id": "mw4nc510vmah3", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T06:06:30.000Z", "createdAt": "2026-11-06T07:21:50.453Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "4639086c42da6b3df94740f4094f44c9", "mediaType": "image", "id": "mw4nc7lhox1ug", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T06:06:45.000Z", "createdAt": "2026-11-06T07:21:54.290Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "938d9f4d63f5338d065e4157407daeb0", "mediaType": "image", "id": "mw4ncak27517v", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T06:07:16.000Z", "createdAt": "2026-11-06T07:21:57.772Z", "place": "용당돈대", "x": 516.9, "y": 298.4, "asset": "ae5dd8183573d01645f025f9701f2271", "mediaType": "image", "id": "mw4ncd8sswcrd", "group": "gmw4nbhzcu4x"}, {"day": 1, "kind": "이야기 나누기", "text": "민지 배우가 2022, 2023년에 담근 매실청으로 따뜻한 차를 나누어 마시니, 차가운 바람에 얼얼했던 몸이 조금씩 녹기 시작한다. \n다같이 마당으로 나가, 아직 가지가 열려있는 민지의 텃밭을 지나 매실 나무를 만난다. 그리고 잘려진 나무...사라진 쿠키", "takenAt": "2026-11-06T07:58:58.000Z", "createdAt": "2026-11-06T13:47:53.622Z", "place": "공간 그리고", "x": 501.3, "y": 460.9, "asset": "1383e230abf77df5bacdcc53b6dfecf6", "mediaType": "image", "id": "mw514oeu13mvp", "group": "gmw514ms4ap7", "textEn": "Actor Minji shares warm tea made with plum syrup she preserved in 2022 and 2023, and as we drink it, the body that was numbed by the cold wind begins to thaw little by little.\nWe all head out to the yard, passing Minji's vegetable garden, where the branches are still bearing fruit, and meet a plum tree. And then a cut-down tree... a vanished cookie."}, {"day": 1, "kind": "이야기 나누기", "text": "", "takenAt": "2026-11-06T08:01:30.000Z", "createdAt": "2026-11-06T13:47:55.260Z", "place": "공간 그리고", "x": 501.3, "y": 460.9, "asset": "2d01c912ae23edc14be2bbd3ae6ffcb7", "mediaType": "image", "id": "mw514pocf342y", "group": "gmw514ms4ap7"}, {"day": 1, "kind": "이야기 나누기", "text": "", "takenAt": "2026-11-06T08:07:46.000Z", "createdAt": "2026-11-06T13:47:57.615Z", "place": "공간 그리고", "x": 501.3, "y": 460.9, "asset": "f85ac9ff9bd310b43dc07dd3b5a0c5b8", "mediaType": "image", "id": "mw514rhrr67f4", "group": "gmw514ms4ap7"}, {"day": 1, "kind": "이야기 나누기", "text": "", "takenAt": "2026-11-06T08:17:07.000Z", "createdAt": "2026-11-06T13:47:59.663Z", "place": "공간 그리고", "x": 501.3, "y": 460.9, "asset": "16a5fc0eb5227b1d6db5cd3f7f0d72ef", "mediaType": "image", "id": "mw514t2nghuin", "group": "gmw514ms4ap7"}, {"day": 1, "kind": "이야기 나누기", "text": "", "takenAt": "2026-11-06T08:19:00.000Z", "createdAt": "2026-11-06T13:48:01.491Z", "place": "공간 그리고", "x": 501.3, "y": 460.9, "asset": "de7e00b2b2ebecca4157d1c0b28f426a", "mediaType": "image", "id": "mw514uhff3ix4", "group": "gmw514ms4ap7"}, {"day": 1, "kind": "이야기 나누기", "text": "", "takenAt": "2026-11-06T08:19:49.000Z", "createdAt": "2026-11-06T13:48:03.144Z", "place": "공간 그리고", "x": 501.3, "y": 460.9, "asset": "5d924f94ed22404615ee491cc9f2018b", "mediaType": "image", "id": "mw514vrcs4hep", "group": "gmw514ms4ap7"}, {"day": 1, "kind": "쉬어 가기", "text": "가지가 알려주는 가지와 생태텃밭 이야기 from 미선", "takenAt": "2026-11-06T08:10:54.000Z", "createdAt": "2026-11-06T13:51:38.597Z", "place": "공간 그리고", "x": 506.6, "y": 460.4, "asset": "8c170a8d18b062a58d3e5d87296f5495", "mediaType": "image", "lat": 37.67363611111111, "lng": 126.50927777777778, "id": "mw519i06fodo6", "textEn": "Eggplant Tells the Story of Eggplants and the Ecological Vegetable Patch, from Miseon"}, {"day": 1, "kind": "쉬어 가기", "text": "첫 번째 비박을 위해 공간 그리고 옥상에 텐트를 치는 중. 오늘 날씨가 갑작기 겨울의 문턱에 들어선 듯 바람이 차다. 오늘밤 무사히 보낼 수 있을까? 텐트 치는 실력이 모두 어설프다.", "takenAt": "2026-11-06T08:27:01.000Z", "createdAt": "2026-11-06T13:54:13.428Z", "place": "공간 그리고", "x": 504.6, "y": 460.6, "asset": "5a9d29e4044c48f299440c4dffc24fda", "mediaType": "image", "id": "mw51cth0iziew", "group": "gmw51cs4pwcl", "textEn": "Setting up a tent on the rooftop of Space And for the first bivouac. The weather has suddenly turned, and the wind feels cold, as if we've stepped onto the threshold of winter. Will we get through tonight safely? Our tent-pitching skills are all clumsy."}, {"day": 1, "kind": "쉬어 가기", "text": "", "takenAt": "2026-11-06T08:27:09.000Z", "createdAt": "2026-11-06T13:54:15.885Z", "place": "공간 그리고", "x": 504.6, "y": 460.6, "asset": "7bd25ecc07c54ae41a2ea7fd4e3682da", "mediaType": "image", "id": "mw51cvd924uzn", "group": "gmw51cs4pwcl"}, {"day": 1, "kind": "Good Mourning - 젊은 연극인의 장례식", "text": "자신의 연극이 올라가는 극장에서 생을 마감하고 싶다는...찐 연극인.\n그에게 던져진 수 많은 자신의 죽음과 삶에 대한 질문과 그의 답을 들으며, 생각해본다. 마지막 내 눈에 담고 싶은 것은 무엇인지......", "takenAt": "2026-11-06T08:47:57.000Z", "createdAt": "2026-11-06T14:03:28.339Z", "place": "공간 그리고", "x": 502.6, "y": 460.8, "asset": "2d98301940b898a9b8e884a4e8208ce3", "mediaType": "image", "id": "mw51opn7nrotm", "group": "gmw51ooti4a4", "kindEn": "Good Mourning - The Funeral of a Young Theatre Artist", "textEn": "A true theatre person, to the core, who wishes to end his life in the very theatre where his play is being staged. Listening to the many questions put to him about his own death and life, and to his answers, I wonder: what is the last thing I would want my eyes to hold......"}, {"day": 1, "kind": "Good Mourning - 젊은 연극인의 장례식", "text": "", "takenAt": "2026-11-06T08:51:23.000Z", "createdAt": "2026-11-06T14:03:30.902Z", "place": "공간 그리고", "x": 502.6, "y": 460.8, "asset": "3690efc89680cb7c8a830306242f8efa", "mediaType": "image", "id": "mw51orme9ntjl", "group": "gmw51ooti4a4", "kindEn": "Good Mourning - The Funeral of a Young Theatre Artist"}, {"day": 1, "kind": "Good Mourning - 젊은 연극인의 장례식", "text": "", "takenAt": "2026-11-06T08:51:50.000Z", "createdAt": "2026-11-06T14:03:32.231Z", "place": "공간 그리고", "x": 502.6, "y": 460.8, "asset": "79e2f10d63d84218f1f5ccf558d07f0e", "mediaType": "image", "id": "mw51osnbvr0wt", "group": "gmw51ooti4a4", "kindEn": "Good Mourning - The Funeral of a Young Theatre Artist"}, {"day": 1, "kind": "Good Mourning - 젊은 연극인의 장례식", "text": "", "takenAt": "2026-11-06T08:54:41.000Z", "createdAt": "2026-11-06T14:03:33.342Z", "place": "공간 그리고", "x": 502.6, "y": 460.8, "asset": "450cbb92da5fab47cbbeda8c733466ed", "mediaType": "image", "id": "mw51oti6nn4fp", "group": "gmw51ooti4a4", "k et": "d72f2c91c2144da387208d27f15e783d", "mediaType": "image", "id": "mw5suynxpmxe3", "group": "gmw5susaqd08", "kindEn": "Taking down the tent and preparing to set out again"}, {"day": 2, "kind": "걷기 중 동료들을 만나다.", "text": "희와래에 모여 일요일 오두돈대 <모두를 위한 망보기>를 준비 중인 한국, 말레이시아, 싱가포르의 동료들에게 인사를 건넨다. 엄청난 환대를 받고 다시 떠납니다. 오늘도 화이팅!", "takenAt": "2026-11-07T02:40:00.000Z", "createdAt": "2026-11-07T02:47:21.495Z", "place": "희와래", "x": 494.1, "y": 504, "asset": "acefeee2f6e06961fdf0adc4205d3a32", "mediaType": "video", "id": "mw5sz2qffpoed", "textEn": "I greet the colleagues from Korea, Malaysia and Singapore who are gathering at Heewarae to prepare for Sunday's <Watching Over Everyone> at Odudondae fort. I received tremendous hospitality and am setting off again. Hwaiting, today too!", "kindEn": "Met up with colleagues while walking."}, {"day": 2, "kind": "동료들의 환대", "text": "희와래를 지나가는 길, 희와래에서 일요일 공연을 준비중인 동료들의 환대", "takenAt": "2026-11-07T02:35:00.000Z", "createdAt": "2026-11-07T04:36:07.526Z", "place": "희와래 논길", "x": 496.1, "y": 500.6, "asset": "19484fd6f5c5da6b555b0515424c0868", "mediaType": "video", "id": "mw5wuy92r3yfe", "group": "gmw5wuwwbz52", "textEn": "The walk past Heewarae, the hospitality of colleagues preparing for Sunday's performance at Heewarae", "placeEn": "Heewarae paddy path", "kindEn": "Hospitality from colleagues"}, {"day": 2, "kind": "동료들의 환대", "text": "", "takenAt": "2026-11-07T02:35:00.000Z", "createdAt": "2026-11-07T04:36:10.701Z", "place": "희와래 논길", "x": 496.1, "y": 500.6, "asset": "c5a49c7b58db1b9f9a1068943f1e67ea", "mediaType": "video", "id": "mw5wv0p95l1rt", "group": "gmw5wuwwbz52", "placeEn": "Heewarae paddy path", "kindEn": "Hospitality from colleagues"}, {"day": 2, "kind": "책방 국자와주걱 도착", "text": "책방 국자와주걱 도착", "takenAt": "2026-11-07T06:00:00.000Z", "createdAt": "2026-11-07T15:20:08.181Z", "place": "국자와주걱", "x": 340, "y": 543, "id": "mw6jv5kloh2ey", "textEn": "Arrived at bookshop Gukja & Jugeok", "kindEn": "Arrived at bookshop Gukja & Jugeok"}, {"day": 2, "kind": "연리목+최영두의 사운드 워크", "text": "지금은 없지만 여기 있었던 것들을 느끼는 시간", "takenAt": "2026-11-07T07:40:25.000Z", "createdAt": "2026-11-07T15:26:20.188Z", "place": "국자와주걱", "x": 340, "y": 543, "asset": "e8934a573f0965c9183cac019ffe2e0d", "mediaType": "image", "id": "mw6k34m4pa9r9", "group": "gmw6k31gg7v8", "textEn": "A time to feel the things that were once here but are no longer here.", "kindEn": "Yeonrimok + Choi Yeongdu's sound walk"}, {"day": 2, "kind": "연리목+최영두의 사운드 워크", "text": "", "takenAt": "2026-11-07T07:40:29.000Z", "createdAt": "2026-11-07T15:26:24.499Z", "place": "국자와주걱", "x": 340, "y": 543, "asset": "a066198cc88254aeabe47e26770cb5d7", "mediaType": "image", "id": "mw6k37xvaa0n6", "group": "gmw6k31gg7v8", "kindEn": "Yeonrimok + Choi Yeongdu's sound walk"}, {"day": 2, "kind": "연리목+최영두의 사운드 워크", "text": "", "takenAt": "2026-11-07T07:41:48.000Z", "createdAt": "2026-11-07T15:26:26.024Z", "place": "국자와주걱", "x": 340, "y": 543, "asset": "a1617601f331212481ef4fa20a6b6cf7", "mediaType": "image", "id": "mw6k39484cx7g", "group": "gmw6k31gg7v8", "kindEn": "Yeonrimok + Choi Yeongdu's sound walk"}, {"day": 2, "kind": "연리목+최영두의 사운드 워크", "text": "", "takenAt": "2026-11-07T07:50:56.000Z", "createdAt": "2026-11-07T15:26:27.560Z", "place": "국자와주걱", "x": 340, "y": 543, "asset": "8c7d224e4ff6fd8e3f649e98dacd33f7", "mediaType": "image", "id": "mw6k3aaxf0g81", "group": "gmw6k31gg7v8", "kindEn": "Yeonrimok + Choi Yeongdu's sound walk"}, {"day": 2, "kind": "Good Mourning 두 번째 장례식", "text": "역사 · 예순세 살 지식인의 장례식 - 시간이 묻어있는 책들. 80년대의 투쟁과 저항, 꿈을 가지고 있던 시간과 현재의 중첩된 소리들. 그의 삶의 길은 우정의 길이라하고, 안나는 사랑은 질문일뿐 대답이 아니라 답한다.", "takenAt": "2026-11-07T10:00:13.000Z", "createdAt": "2026-11-07T15:34:05.282Z", "place": "황구형님댁", "x": 346.8, "y": 547.2, "asset": "23b3d45f1416bc86eb34959268ce6e93", "mediaType": "image", "id": "mw6kd3hep8xmh", "group": "gmw6kd2a13wb", "textEn": "History · The funeral of a sixty-three-year-old intellectual – books steeped in time. The overlapping sounds of the present and of a At": "2026-11-07T10:35:12.000Z", "createdAt": "2026-11-07T15:34:22.391Z", "place": "황구형님댁", "x": 346.8, "y": 547.2, "asset": "2c7d7474568a9fd11022ecd55205a0fa", "mediaType": "image", "id": "mw6kdgonzxzo6", "group": "gmw6kd2a13wb", "kindEn": "Good Mourning · Second funeral", "placeEn": "Hwanggu's house"}, {"day": 2, "kind": "Good Mourning 두 번째 장례식", "text": "", "takenAt": "2026-11-07T10:36:02.000Z", "createdAt": "2026-11-07T15:34:24.018Z", "place": "황구형님댁", "x": 346.8, "y": 547.2, "asset": "2bd6144f638e43f2cb1063a83bffd625", "mediaType": "image", "id": "mw6kdhxulsxbw", "group": "gmw6kd2a13wb", "kindEn": "Good Mourning · Second funeral", "placeEn": "Hwanggu's house"}, {"day": 2, "kind": "Good Mourning 두 번째 장례식", "text": "", "takenAt": "2026-11-07T10:43:58.000Z", "createdAt": "2026-11-07T15:34:25.376Z", "place": "황구형님댁", "x": 346.8, "y": 547.2, "asset": "d7bb14483c5e2e391ab2f8b5fea5a94e", "mediaType": "image", "id": "mw6kdizkqopma", "group": "gmw6kd2a13wb", "kindEn": "Good Mourning · Second funeral", "placeEn": "Hwanggu's house"}, {"day": 2, "kind": "Good Mourning 두 번째 장례식", "text": "", "takenAt": "2026-11-07T10:46:09.000Z", "createdAt": "2026-11-07T15:34:27.090Z", "place": "황구형님댁", "x": 346.8, "y": 547.2, "asset": "e5964e3dca22845bb940ea565b669b6e", "mediaType": "image", "id": "mw6kdkb6717wj", "group": "gmw6kd2a13wb", "kindEn": "Good Mourning · Second funeral", "placeEn": "Hwanggu's house"}, {"day": 3, "kind": "8일 걷기 시작", "text": "두 번째 장례식과 비박을 마치고 조금은 무거워진 몸이지만, 다시 설레는 마음으로 소멸의 목격자로서 마지막 날 걷기를 시작한다. 오늘의 관객을 만나, 지도를 건네고 걷기 시작. 어제의 뜨거운 가을 햇살대신 오늘은 겨울을 머금은 바람을 안고 떠난다. 입동이다.", "takenAt": "2026-11-08T01:00:01.000Z", "createdAt": "2026-11-09T03:44:16.878Z", "place": "책방 국자와주걱", "x": 341.7, "y": 544, "asset": "e9385e20df8cb8d3c54b27ce0fc355d2", "mediaType": "image", "id": "mw8pvze6cujtw", "group": "gmw8pvxj2miv", "textEn": "Having finished the second funeral and the bivouac, my body is a little heavier, but with my heart fluttering again, I begin the last day's walk as a witness to dissolution. I met today's audience, handed over the map, and started walking. Instead of yesterday's hot autumn sunlight, I set off today into a wind carrying winter. It is Ipdong, the first day of winter.", "placeEn": "Gukja & Jugeok bookshop", "kindEn": "Starting the walk on day 8"}, {"day": 3, "kind": "8일 걷기 시작", "text": "", "takenAt": "2026-11-08T01:00:14.000Z", "createdAt": "2026-11-09T03:44:18.415Z", "place": "책방 국자와주걱", "x": 341.7, "y": 544, "asset": "b63ff5941eccc0fec7709c326edc74e6", "mediaType": "image", "id": "mw8pw0kvk679u", "group": "gmw8pvxj2miv", "placeEn": "Gukja & Jugeok bookshop", "kindEn": "Starting the walk on day 8"}, {"day": 3, "kind": "8일 걷기 시작", "text": "", "takenAt": "2026-11-08T01:12:46.000Z", "createdAt": "2026-11-09T03:44:19.439Z", "place": "책방 국자와주걱", "x": 341.7, "y": 544, "asset": "9c4ced48d0b55674979ac72e637307f7", "mediaType": "image", "id": "mw8pw1db405j5", "group": "gmw8pvxj2miv", "placeEn": "Gukja & Jugeok bookshop", "kindEn": "Starting the walk on day 8"}, {"day": 3, "kind": "8일 걷기 시작", "text": "", "takenAt": "2026-11-08T01:13:20.000Z", "createdAt": "2026-11-09T03:44:21.485Z", "place": "책방 국자와주걱", "x": 341.7, "y": 544, "asset": "da47f8df5719a138935a3bbaadfc5b99", "mediaType": "image", "id": "mw8pw2y5ca421", "group": "gmw8pvxj2miv", "placeEn": "Gukja & Jugeok bookshop", "kindEn": "Starting the walk on day 8"}, {"day": 3, "kind": "8일 걷기 시작", "text": "", "takenAt": "2026-11-08T01:14:45.000Z", "createdAt": "2026-11-09T03:44:23.228Z", "place": "책방 국자와주걱", "x": 341.7, "y": 544, "asset": "defc7d6ea67b9481f3af589edd34a8d8", "mediaType": "image", "id": "mw8pw4akgt6jt", "group": "gmw8pvxj2miv", "placeEn": "Gukja & Jugeok bookshop", "kindEn": "Starting the walk on day 8"}, {"day": 3, "kind": "공연", "text": "없는극장까지 걷기를 마치고, 희와래, 행, 쇼, 오랑오랑 드럼 씨어터의 공연을 보러 오두돈대에 도착했다. 2주간 지역의 다양한 커뮤니티와 소멸에 대한 이야기를 나누며 함께한 시간이 오롯이 오두돈대에 담겨있다 사라짐 예보를 접수하고, 질문에 답하고, 함께 춤추고 다같이 망을 보듯이 돈대위로 서 밖을 응시했다. 무엇이 사라지고 있고, 우리는 지금 무엇을 살펴야 할까?", "takenAt": "2026-11-08T04:08:20.000Z", "createdAt": "2026-11-09T03:57:29.273Z", "place": "오두돈대", "x": 534.4, "y": 423, "id": "mw8qcyt582kj8", "group": "gmw8qcxwrtth", "textEn": "After finishing the walk to The Void Theatre, we arrived at Odudondae (Odu watch post) to see the performance by Heewarae, Haeng, Show, and Orang Orang Drum Theatre. The time we spent over two weeks sharing stories with the region's various communities about disappearance is fully held in Odudondae. We received a Disappearance Forecast, answered questions, danced together, and stood on top of the dondae looking out, as if keeping watch together. What is disappearing, and what should we be looking at now?", "kindEn": "Performance"}, {"day": 3, "kind": "공연", "text": "", "takenAt": "2026-11-08T04:10:46.000Z", "createdAt": "2026-11-09T03:57:30.908Z", "place": "오두돈대", "x": 534.4, "y": 423, "asset": "e72e6ed907816b97ce642d57ce861e96", "mediaType": "image", "id": "mw8qd02k630h4", "group": "gmw8qcxwrtth", "kindEn": "Performance"}, {"day": 3, "kind": "공연", "text": "", "takenAt": "2026-11-08T04:12:06.000Z", "createdAt": "2026-11-09T03:57:33.099Z", "place": "오두돈대", "x": 534.4, "y": 423, "asset": "0bcc2a29313f231e48d387e9309a5b5f", "mediaType": "image", "id": "mw8qd1rfgj2uw", "group": "gmw8qcxwrtth", "kindEn": "Performance"}, {"day": 3, "kind": "공연", "text": "", "takenAt": "2026-11-08T04:15:40.000Z", "createdAt": "2026-11-09T03:57:34.185Z", "place": "오두돈대", "x": 534.4, "y": 423, "asset": "59fd9457cfda06394bb8d4db28ac6818", "mediaType": "image", "id": "mw8qd2llhbq8m", "group": "gmw8qcxwrtth", "kindEn": "Performance"}, {"day": 3, "kind": "공연", "text": "", "takenAt": "2026-11-08T04:16:39.000Z", "createdAt": "2026-11-09T03:57:35.823Z", "place": "오두돈대", "x": 534.4, "y": 423, "asset": "cfd0d5e5b83e459615c9c30b58bd72e0", "mediaType": "image", "id": "mw8qd3v3t39lq", "group": "gmw8qcxwrtth", "kindEn": "Performance"}, {"day": 3, "kind": "공연", "text": "", "takenAt": "2026-11-08T04:19:40.000Z", "createdAt": "2026-11-09T03:57:37.974Z", " mw8qcxwrtth", "kindEn": "Performance"}, {"day": 3, "kind": "공연", "text": "", "takenAt": "2026-11-08T04:42:45.000Z", "createdAt": "2026-11-09T03:58:04.189Z", "place": "오두돈대", "x": 534.4, "y": 423, "asset": "3bdf4ac5f380a06d5f2b72295f9e9d82", "mediaType": "image", "id": "mw8qdpr12fzu8", "group": "gmw8qcxwrtth", "kindEn": "Performance"}, {"day": 3, "kind": "Good Mourning  세 번째 장례식 - 의례", "text": "Good Mourning 살아 있는 동안 치르는 세 번의 장례식 중 의례 · 세븐일레븐에서 일하는 여성의 장례식. 마지막이다. 칼 바람이 불어온다. 편의점 밖 의자 위, 옷 위의 차가운 얼음이 놓여있다. 편의점 여사장님의 녹음된 인터뷰 목소리가 들려온다. 죽음을 어떻게 자연스러우면서 행복하게 받아들일 수 있을까? 수의로 화관과 예쁜 옷을 입고 싶고, 사랑하는 사람의 손을 꼭 잡고 그 사람을 마지막 눈에 담고자 하는 여사장님은 관객들에게 소주를 한잔씩 건낸다. 죽음의 순간을 상상하며, 다시 내 삶과 공동체를 들여다보게 되는 세번의 장례식을 통해 많은 질문이 마음 속으로 들어온다.", "takenAt": "2026-11-08T06:41:39.000Z", "createdAt": "2026-11-09T04:06:31.622Z", "place": "후대 돈대 옆 세블 일레븐 편의점", "x": 436.7, "y": 711.2, "asset": "47ccd07ae8b19e296635f686b65f2b67", "mediaType": "image", "id": "mw8qolaezchua", "group": "gmw8qok9gtfo", "textEn": "Good Mourning: One of Three Funerals Held While Alive, a Ritual. The funeral of a woman who works at 7-Eleven. This is the last one. A bitter cold wind blows in. Outside the convenience store, on a chair, lies clothing covered in cold ice. The recorded interview voice of the convenience store's female owner can be heard. How can we accept death naturally and happily? She wants to wear a flower crown and pretty clothes as her burial clothes, to hold the hand of someone she loves tightly, and to keep that person in her last sight. She hands each audience member a shot of soju. Imagining the moment of death and looking again at my own life and community, many questions enter my mind through these three funerals.", "placeEn": "7-Eleven beside Huae Dondae", "kindEn": "Good Mourning, Third Funeral, Ritual"}, {"day": 3, "kind": "Good Mourning  세 번째 장례식 - 의례", "text": "", "takenAt": "2026-11-08T06:41:48.000Z", "createdAt": "2026-11-09T04:06:32.953Z", "place": "후대 돈대 옆 세블 일레븐 편의점", "x": 436.7, "y": 711.2, " 의점", "x": 436.7, "y": 711.2, "asset": "4f156c095cbb8258ccf76199d196f02e", "mediaType": "image", "id": "mw8qou7ue9saz", "group": "gmw8qok9gtfo", "placeEn": "7-Eleven beside Huae Dondae", "kindEn": "Good Mourning, Third Funeral, Ritual"}, {"day": 3, "kind": "Good Mourning  세 번째 장례식 - 의례", "text": "", "takenAt": "2026-11-08T07:12:52.000Z", "createdAt": "2026-11-09T04:06:45.126Z", "place": "후대 돈대 옆 세블 일레븐 편의점", "x": 436.7, "y": 711.2, "asset": "c8b7f6deedd2d4c7ddf77a2832eab898", "mediaType": "image", "id": "mw8qovpivkx9x", "group": "gmw8qok9gtfo", "placeEn": "7-Eleven beside Huae Dondae", "kindEn": "Good Mourning, Third Funeral, Ritual"}, {"day": 3, "kind": "Good Mourning 설치와 마지막 의식", "text": "세 번의 장례식 끝에 다다른 마지막 의식의 장소. 세 곳을 옮겨 다닌 과일은 조금씪 모양이 흐트러지고, 부패하기 시작한다. 없는 극장에 설치 되어 있는 커튼은 앤드씨어터가 매일 장례식의 장소에 친 텐트의 모양을 닮아있다. 소멸을 애도하는 음악과 퍼포머의 춤. 이탈리아 예술가들의 고향의 음악과 몸짓이 묘하게 우리의 의식과 겹쳐진다.", "takenAt": "2026-11-08T07:40:59.000Z", "createdAt": "2026-11-09T04:13:29.224Z", "place": "없는극장", "x": 455, "y": 713.4, "asset": "6fd837fc88d884d0c78716852997c161", "mediaType": "image", "id": "mw8qxjig5d21b", "group": "gmw8qxicgwma", "textEn": "The place of the final rite, reached at the end of three funerals. The fruit, carried from place to place three times, slowly loses its shape and begins to decay. The curtains installed at The Void Theatre resemble the tents A.N.D. Theatre pitched at each day's funeral site. Music mourning disappearance, and the performers' dance. The music and gestures of the Italian artists' hometowns overlap strangely with our own rites.", "kindEn": "Good Mourning · Installation and final rite"}, {"day": 3, "kind": "Good Mourning 설치와 마지막 의식", "text": "", "takenAt": "2026-11-08T07:41:33.000Z", "createdAt": "2026-11-09T04:13:30.847Z", "place": "없는극장", "x": 455, "y": 713.4, "asset": "c548db38a5e287915404789b7e862775", "mediaType": "image", "id": "mw8qxkrjkz7se", "group": "gmw8qxicgwma", "kindEn": "Good Mourning · Installation and final rite"}, {"day": 3, "kind": "Good Mourning 설치와 마지막 의식", "text": "", "takenAt": "2026-11-08T07:43:54.000Z", "createdAt": "2026-11-09T04:13:32.296Z", "place": "없는극장", "x": 455, "y": 713.4, "asset": "666ae2971a17f04507eab344e8c79bc9", "mediaType": "image", "id": "mw8qxlvsy51ud", "group": "gmw8qxicgwma", "kindEn": "Good Mourning · Installation and final rite"}, {"day": 3, "kind": "Good Mourning 설치와 마지막 의식", "text": "", "takenAt": "2026-11-08T07:44:24.000Z", "createdAt": "2026-11-09T04:13:33.730Z", "place": "없는극장", "x": 455, "y": 713.4, "asset": "1ba31422b78258def08728107a1900b3", "mediaType": "image", "id": "mw8qxmzmvhxax", "group": "gmw8qxicgwma", "kindEn": "Good Mourning · Installation and final rite"}, {"day": 3, "kind": "Good Mourning 설치와 마지막 의식", "text": "", "takenAt": "2026-11-08T07:46:12.000Z", "createdAt": "2026-11-09T04:13:35.163Z", "place": "없는극장", "x": 455, "y": 713.4, "asset": "c38355b8a5c25e5db16cb6f2ddd1850f", "mediaType": "image", "id": "mw8qxo3f20giy", "group": "gmw8qxicgwma", "kindEn": "Good Mourning · Installation and final rite"}, {"day": 3, "kind": "Good Mourning 설치와 마지막 의식", "text": "", "takenAt": "2026-11-08T07:48:01.000Z", "createdAt": "2026-11-09T04:13:36.494Z", "place": "없는극장", "x": 455, "y": 713.4, "asset": "6a97b3de92c10c631db27177ef6a604f", "mediaType": "image", "id": "mw8qxp4ednkwi", "group": "gmw8qxicgwma", "kindEn": "Good Mourning · Installation and final rite"}, {"day": 3, "kind": "Good Mourning 설치와 마지막 의식", "text": "", "takenAt": "2026-11-08T07:49:17.000Z", "createdAt": "2026-11-09T04:13:37.655Z", "place": "없는극장", "x": 455, "y": 713.4, "asset": "e84b78f94e0f2263531b7fd58781dc04", "mediaType": "image", "id": "mw8qxq0nl9vzs", "group": "gmw8qxicgwma", "kindEn": "Good Mourning · Installation and final rite"}, {"day": 1, "kind": "다같이 갯벌을 따라 걷기", "text": "소노노치의< 내가 느낄 수 있는, 사라짐의 쓸쓸함과 아름다움에 대하여>...원래 계획은 한 시간 가량 갯벌을 따라 걸으며 후애 돈대 뒷편에서 풍경을 함께 바라보기였다. 올해 겨울의 시작을 제대로 보여주는 듯 입동의 바람이 매섭다. 시간을 줄여 30분 정도 갯벌을 걸으며, 소노노치와 풍경을 바라봤다. 저 멀리 사라지는 퍼포머, 하늘의 가로지르는 철새들, 물 위 오리 무리들. 가을이 가는 것도, 지금 시간이 사라지는 것도...쓸쓸하다. 하지만 아름답다.", "takenAt": "2026-11-08T08:11:54.000Z", "createdAt": "2026-11-09T04:19:35.824Z", "place": "없는극장 뒷편 갯벌 길", "x": 448.5, "y": 732.9, "asset": "1186e8685a60e98d99a5e4d7d59931e6", "mediaType": "image", "id": "mw8r5edske1os", "group": "gmw8r5d2f5mg", "textEn": "Sononochi's <On the Loneliness and Beauty of Disappearance That I Can Feel>... The original plan was to walk along the mudflat for about an hour and look at the landscape together behind Huae Dondae. The wind of Ipdong, the first day of winter, was bitter, as if to show that this year's winter had truly begun. We cut it short, walking the mudflat for about 30 minutes and watching the landscape with Sononochi. A performer disappearing far away, migratory birds crossing the sky, a flock of ducks on the water. Autumn passing, this very moment disappearing... it is lonely. But it is beautiful.", "kindEn": "Walking together along the mudflat", "placeEn": "Mudflat path behind The Void Theatre"}, {"day": 1, "kind": "다같이 갯벌을 따라 걷기", "text": "", "takenAt": "2026-11-08T08:16:17.000Z", "createdAt": "2026-11-09T04:19:37.742Z", "place": "없는극장 뒷편 갯벌 길", "x": 448.5, "y": 732.9, "asset": "1b2d948712ed2983ed065840168630a7", "mediaType": "image", "id": "mw8r5fv281o36", "group": "gmw8r5d2f5mg", "kindEn": "Walking together along the mudflat", "placeEn": "Mudflat path behind The Void Theatre"}, {"day": 1, "kind": "다같이 갯벌을 따라 걷기", "text": "", "takenAt": "2026-11-08T08:20:33.000Z", "createdAt": "2026-11-09T04:19:39.356Z", "place": "없는극장 뒷편 갯벌 길", "x": 448.5, "y": 732.9, "asset": "565fccdd22b4cedce0612a3e61a43d87", "mediaType": "image", "id": "mw8r5h3wkyh2n", "group": "gmw8r5d2f5mg", "kindEn": "Walking together along the mudflat", "placeEn": "Mudflat path behind The Void Theatre"}, {"day": 1, "kind": "다같이 갯벌을 따라 걷기", "text": "", "takenAt": "2026-11-08T08:20:46.000Z", "createdAt": "2026-11-09T04:19:41.258Z", "place": "없는극장 뒷편 갯벌 길", "x": 448.5, "y": 732.9, "asset": "5c0ad05c770d9eafd7c56cce53c9d36d", "mediaType":   cl.forEach(c=>{const n=c.posts.length, days=[...new Set(c.posts.map(q=>q.e.day))], first=c.posts[0].e;
    const on=c.posts.some(q=>q.g.some(x=>x.id===selected));
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','pin'+(on?' sel':'')); g.setAttribute('tabindex','0'); g.setAttribute('role','button');
    g.setAttribute('aria-label',n>1?T(`기록 ${n}개`,`${n} moments`):T('기록 1개','1 moment'));
    const fill=days.length===1?(DAYC[days[0]]||'var(--ink)'):'var(--ink)';
    g.innerHTML=n>1?`<circle cx="${c.x}" cy="${c.y}" r="11" fill="${fill}"/><text class="pnum" x="${c.x}" y="${c.y}" text-anchor="middle" dominant-baseline="central">${n}</text>`:`<circle cx="${c.x}" cy="${c.y}" r="6.5" fill="${fill}"/>`;
    g.addEventListener('click',()=>select(first.id,true)); g.addEventListener('keydown',ev=>{if(ev.key==='Enter')select(first.id,true)});
    pg.appendChild(g)});
  let html='', lastDay=null;
  gs.forEach(g=>{const e=g.find(x=>x.text)||g[0];
    if(e.day!==lastDay){html+=EN?`<h2>${DAYLE[e.day]||''} · Day ${e.day}</h2>`:`<h2>${DAYL[e.day]||''} · ${e.day}일차</h2>`; lastDay=e.day}
    let stop=e.place||'길 위'; if(EN) stop=STOPEN[stop]||e.placeEn||(stop==='길 위'?'On the road':stop);
    const kind=EN?(KINDEN[e.kind]||e.kindEn||e.kind):e.kind; const memo=EN?(e.textEn||e.text):e.text;
    const all=g.filter(x=>x.asset), ms=all.filter(x=>x.mediaType!=='video'), vids=all.filter(x=>x.mediaType==='video'), multi=ms.length>1;
    const alt=esc((kind||'')+' · '+(stop||''));
    const one=x=>x.mediaType==='video'?`<video src="${M}${esc(x.asset)}.mp4" poster="${M}${esc(x.asset)}-poster.webp" controls playsinline preload="none"></video>`:`<img src="${M}${esc(x.asset)}.webp" alt="${alt}" loading="lazy" decoding="async">`;
    let media='';
    if(multi){media=`<div class="media"><div class="slides" tabindex="0" aria-label="${T('사진 넘기기','Swipe through photos')}">${ms.map(x=>`<div class="slide" data-id="${esc(x.id)}">${one(x)}</div>`).join('')}</div><span class="count">1 / ${ms.length}</span><button type="button" class="snav prev" aria-label="${T('이전','Previous')}" disabled>‹</button><button type="button" class="snav next" aria-label="${T('다음','Next')}">›</button></div>`}
    else if(ms.length){media=`<div class="media">${one(ms[0])}</div>`}
    media+=vids.map(x=>`<div class="media vone">${one(x)}</div>`).join('');
    const gm=(typeof e.lat==='number')?` · <a href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}" target="_blank" rel="noopener">${T('정확한 위치','Exact location')}</a>`:'';
    const sel=g.some(x=>x.id===selected), ids=g.map(x=>x.id).join(',');
    html+=`<article class="entry${sel?' sel':''}" id="e-${esc(e.id)}" data-ids="${esc(ids)}">${media}<div class="body">${multi?`<div class="dots">${ms.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}<div class="meta"><span class="tag"><i style="background:${DAYC[e.day]}"></i>${esc(kind||'')}</span><span>${esc(stop||'')}</span><span>${fmtTime(e.takenAt)}</span>${gm}</div>${memo?`<p>${esc(memo).replace(/\n/g,'<br>')}</p>`:''}</div></article>`});
  const tr=$('#trail'); tr.innerHTML=html;
  tr.querySelectorAll('.media').forEach(m=>{const sl=m.querySelector('.slides'); if(!sl) return; const n=sl.children.length, art=m.closest('.entry');
    const upd=()=>{const k=Math.max(0,Math.min(n-1,Math.round(sl.scrollLeft/sl.clientWidth))); m.querySelector('.count').textContent=(k+1)+' / '+n; m.querySelector('.prev').disabled=k===0; m.querySelector('.next').disabled=k===n-1; art.querySelectorAll('.dots i').forEach((d,q)=>d.classList.toggle('on',q===k))};
    let t; sl.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(upd,60)},{passive:true});
    const go=d=>{sl.scrollBy({left:d*sl.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};
    m.querySelector('.prev').addEventListener('click',()=>go(-1)); m.querySelector('.next').addEventListener('click',()=>go(1));
    sl.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'){ev.preventDefault();go(1)}if(ev.key==='ArrowLeft'){ev.preventDefault();go(-1)}});
    if(selected){const c=sl.querySelector(`.slide[data-id="${CSS.escape(selected)}"]`); if(c) requestAnimationFrame(()=>{sl.scrollLeft=c.offsetLeft;upd()})}});
  tr.querySelectorAll('video').forEach(v=>v.addEventListener('play',()=>tr.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()})));
}
function select(id,scroll){selected=id;render(); if(scroll){const el=[...document.querySelectorAll('.entry[data-ids]')].find(a=>a.dataset.ids.split(',').includes(id)); el&&el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}}
document.querySelectorAll('.days button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.day;document.querySelectorAll('.days button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
function status(){const n=groupsOf(entries).length, p=entries.filter(e=>e.mediaType==='image').length, v=entries.filter(e=>e.mediaType==='video').length;
  $('#status').innerHTML=T(`기록 <b>${n}</b>개 · 사진 ${p}장, 영상 ${v}개`,`<b>${n}</b> moments · ${p} photos, ${v} videos`)}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{EN=b.dataset.lang==='en';try{history.replaceState(null,'',EN?'#en':location.pathname)}catch(_){location.hash=EN?'en':''}applyLang();status();render()}));
window.addEventListener('hashchange',()=>{EN=location.hash==='#en';applyLang();status();render()});
applyLang(); status(); render();
})();
</script>
</body>
