<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 이 페이지는 한 겹 아래에 있습니다. 모든 상대 경로를 저장소 뿌리에서 풀도록 맞춥니다. -->
<base href="../">

<meta name="description" content="앰비규어스댄스컴퍼니 — 현대무용. 프로듀서그룹 도트와 함께한 작업." data-en="Ambiguous Dance Company — Contemporary dance. Works made with Producer Group DOT.">
<title data-en="Ambiguous Dance Company · Producer Group DOT">앰비규어스 댄스 컴퍼니 · 프로듀서그룹 도트</title>

<!-- 파비콘. 32px 은 로고 액센트 점과 같은 색으로 js/ui.js 의 logo() 가 갈아 끼운다.
     여기 적힌 것은 JS 가 못 돌 때의 기본값이다. -->
<link rel="icon" id="favicon" href="/img/brand/favicon-miseon-32.png" sizes="32x32">
<link rel="icon" id="favicon-lg" href="/img/brand/favicon-miseon-512.png" sizes="512x512">
<!-- 홈 화면에 저장되면 더 바뀌지 않으므로 한 색(잉크)으로 고정한다. -->
<link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">

<!-- 링크 미리보기. og:image 는 반드시 전체 주소여야 한다 — 상대 경로면 뜨지 않는다.
     og:title·og:description 의 data-en 은 영문 화면에서 js/i18n.js 가 갈아 끼운다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="프로듀서그룹 도트" data-en="Producer Group DOT">
<meta property="og:url" content="https://producergroupdot.kr/artists/ambiguous.html">
<meta property="og:title" content="앰비규어스댄스컴퍼니 · 프로듀서그룹 도트" data-en="Ambiguous Dance Company · Producer Group DOT">
<meta property="og:description" content="앰비규어스댄스컴퍼니 — 현대무용. 프로듀서그룹 도트와 함께한 작업." data-en="Ambiguous Dance Company — Contemporary dance. Works made with Producer Group DOT.">
<meta property="og:image" content="https://producergroupdot.kr/img/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/artists.css">

<script type="module" src="js/artist.js"></script>
</head>

<!-- 어느 예술가인지는 여기서만 정합니다. -->
<body data-artist="ambiguous">

<div id="top-bar"></div>
<main id="page"></main>
<div id="page-footer"></div>

</body>
</html>
