<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Artists · Producer Group DOT">Artists · 프로듀서그룹 도트</title>
<meta name="description" content="프로듀서그룹 도트와 함께 작업해 온 예술가들." data-en="Artists who have worked with Producer Group DOT.">

<!-- 파비콘. 32px 은 로고 액센트 점과 같은 색으로 js/ui.js 의 logo() 가 갈아 끼운다.
     여기 적힌 것은 JS 가 못 돌 때의 기본값이다. -->
<link rel="icon" id="favicon" href="/img/brand/favicon-miseon-32.png" sizes="32x32">
<link rel="icon" id="favicon-lg" href="/img/brand/favicon-miseon-512.png" sizes="512x512">
<!-- 홈 화면에 저장되면 더 바뀌지 않으므로 한 색(잉크)으로 고정한다. -->
<link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">

<!-- 링크 미리보기. og:image 는 반드시 전체 주소여야 한다 — 상대 경로면 뜨지 않는다.
     og:title·og:description 의 data-en 은 영문 화면에서 js/i18n.js 가 갈아 끼운다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="프로듀서그룹 도트" data-en="Producer Group DOT">
<meta property="og:url" content="https://producergroupdot.kr/artists.html">
<meta property="og:title" content="Artists · 프로듀서그룹 도트" data-en="Artists · Producer Group DOT">
<meta property="og:description" content="프로듀서그룹 도트와 함께 작업해 온 예술가들." data-en="Artists who have worked with Producer Group DOT.">
<meta property="og:image" content="https://producergroupdot.kr/img/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/artists.css">

<script type="module" src="js/artists.js"></script>
</head>
<body>

<div id="top-bar"></div>

<!-- 매스트헤드는 제목만. 설명 문장은 넣지 않습니다. -->
<header class="masthead">
  <h1>Artists</h1>
</header>

<!-- 자유 배치 캔버스. 좌표와 지름은 data/artists.json 의 pos 가 정합니다. -->
<main id="artists-list"></main>

<div id="page-footer"></div>

</body>
</html>
